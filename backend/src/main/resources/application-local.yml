server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:file:./data/velora;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

velora:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-at-least-32-bytes}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
  market:
    fmp:
      api-key: ${FMP_API_KEY:}
      websocket-endpoint: ${FMP_WEBSOCKET_ENDPOINT:wss://websockets.financialmodelingprep.com/ws}
