server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: velora-markets
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

velora:
  jwt:
    secret: ${JWT_SECRET:velora-markets-super-secure-production-jwt-key-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  portfolio:
    starting-cash: ${VELORA_PORTFOLIO_STARTING_CASH:100000.00}
  market:
    indian-api:
      base-url: ${INDIAN_MARKET_API_BASE_URL:https://stock-api.ankityadav-reh.workers.dev}
      timeout-ms: ${INDIAN_MARKET_API_TIMEOUT_MS:8000}
    dhan:
      client-id: ${DHAN_CLIENT_ID:}
      access-token: ${DHAN_ACCESS_TOKEN:}
      base-url: ${DHAN_BASE_URL:https://api.dhan.co/v2}
      feed-url: ${DHAN_FEED_URL:wss://api-feed.dhan.co}
      scrip-master-url: ${DHAN_SCRIP_MASTER_URL:https://images.dhan.co/api-data/api-scrip-master.csv}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,https://velora-markets.pages.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: WARN
    com.velora.markets: INFO
    com.velora.markets.service.market.dhan.DhanWebSocketMarketService: DEBUG
