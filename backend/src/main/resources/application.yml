server:
  port: 8080

spring:
  application:
    name: velora-markets
  datasource:
    url: jdbc:h2:file:./data/velora;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

velora:
  jwt:
    secret: VeloraMarketsJwtSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm!!
    expiration-ms: 86400000
  portfolio:
    starting-cash: 100000.00
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173

logging:
  level:
    org.springframework.security: WARN
    com.velora.markets: INFO
