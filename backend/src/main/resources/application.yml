server:
  port: 8080

spring:
  application:
    name: velora-markets
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

velora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  portfolio:
    starting-cash: 100000.00
  market:
    fmp:
      api-key: ${FMP_API_KEY:}
      websocket-endpoint: ${FMP_WEBSOCKET_ENDPOINT:wss://websockets.financialmodelingprep.com/ws}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    org.springframework.security: WARN
    com.velora.markets: INFO
    com.velora.markets.service.market.FmpWebSocketMarketService: DEBUG
