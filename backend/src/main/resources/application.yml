server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: velora-markets
  profiles:
    default: local
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

velora:
  jwt:
    secret: ${JWT_SECRET:velora-markets-super-secure-production-jwt-key-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  portfolio:
    starting-cash: ${VELORA_PORTFOLIO_STARTING_CASH:100000.00}
  market:
    fmp:
      api-key: ${FMP_API_KEY:}
      websocket-endpoint: ${FMP_WEBSOCKET_ENDPOINT:wss://websockets.financialmodelingprep.com/ws}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,https://velora-markets.pages.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: WARN
    com.velora.markets: INFO
    com.velora.markets.service.market.FmpWebSocketMarketService: DEBUG
