server:
  port: 0

spring:
  application:
    name: velora-markets-test
  datasource:
    url: jdbc:h2:mem:veloratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

velora:
  jwt:
    secret: velora-markets-super-secure-production-jwt-key-32chars
    expiration-ms: 86400000
  portfolio:
    starting-cash: 100000.00
  market:
    fmp:
      api-key: ""
  cors:
    allowed-origins: http://localhost:5173,https://velora-markets.pages.dev

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
