server:
  port: 0

spring:
  application:
    name: velora-markets-test
  datasource:
    url: jdbc:h2:mem:veloratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

velora:
  jwt:
    secret: velora-markets-super-secure-production-jwt-key-32chars
    expiration-ms: 86400000
  portfolio:
    starting-cash: 100000.00
  market:
    indian-api:
      base-url: "http://127.0.0.1:8787"
      timeout-ms: 2000
    dhan:
      client-id: ""
      access-token: ""
      base-url: "https://api.dhan.co/v2"
      feed-url: "wss://api-feed.dhan.co"
      scrip-master-url: "https://images.dhan.co/api-data/api-scrip-master.csv"
  cors:
    allowed-origins: http://localhost:5173,https://velora-markets.pages.dev

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
